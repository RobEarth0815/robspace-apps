name: 🐞 Bug Report
description: Something in a robspace app is broken, crashes, or behaves unexpectedly.
title: "[Bug] "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! The more specific you can be, the faster the fix lands.

        **⚠️ Privacy:** This is a public repo. Don't include real medication names, real financial figures, or other personal data. Use placeholders.

  - type: dropdown
    id: app
    attributes:
      label: Which app?
      description: Which robspace app is affected?
      options:
        - 4RSS
        - 4Meds
        - 4Budget
        - 4DI
        - 4Migraine
        - 4ToDo
        - Multiple apps
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: The version number shown in the App Store or in the app's settings (e.g. "1.2.3"). If you don't know, write "unknown".
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS / iPadOS version
      description: Settings → General → About → Software Version.
      placeholder: "iOS 18.6"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model
      description: e.g. iPhone 15 Pro, iPad Air (M2), iPhone SE (3rd gen).
      placeholder: "iPhone 15 Pro"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug. What did you do, what did you expect, what did you get instead?
      placeholder: |
        I tapped X, expected Y, but got Z instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so I can hit the same problem on my device.
      placeholder: |
        1. Open the app
        2. Tap "Add new …"
        3. Enter "…"
        4. Tap Save
        5. Crash / wrong result / etc.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you think *should* have happened?
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag images or videos here. **Redact any personal data first.**
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      description: Your honest read — I'll do my own triage too, but your view helps.
      options:
        - "🔥 Critical — data loss, can't launch the app, core feature totally broken"
        - "🚨 High — major feature broken or unusable"
        - "⚠️ Medium — annoying but workable"
        - "🐛 Low — cosmetic, edge case, minor"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Workarounds you found, when it started happening, anything weird that might be a clue.
    validations:
      required: false

  - type: checkboxes
    id: agreements
    attributes:
      label: Before you submit
      options:
        - label: I've redacted personal data from any screenshots or descriptions.
          required: true
        - label: I've searched [open issues](https://github.com/RobEarth0815/robspace-apps/issues) and this isn't a duplicate.
          required: true
        - label: I've read the [Code of Conduct](https://github.com/RobEarth0815/robspace-apps/blob/main/CODE_OF_CONDUCT.md).
          required: true
