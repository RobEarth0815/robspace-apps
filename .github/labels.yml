# Label definitions for robspace-apps.
# These are applied to the repo by scripts/sync-labels.ps1.
# Style: gitignore-flavored "name: color" groups.

# ---- Apps (which product the issue is about) ----
- name: "app:4rss"
  color: "d68910"
  description: "4RSS — RSS reader"
- name: "app:4meds"
  color: "c0392b"
  description: "4Meds — medication tracker"
- name: "app:4budget"
  color: "16a085"
  description: "4Budget — budget tracker"
- name: "app:4di"
  color: "6c3483"
  description: "4DI — data integrity tool"
- name: "app:4migraine"
  color: "9b59b6"
  description: "4Migraine — migraine tracker"
- name: "app:4todo"
  color: "2874a6"
  description: "4ToDo — task manager"
- name: "app:4level"
  color: "8fb82a"
  description: "4Level — fitness level & plan adherence"

# ---- Type (what kind of issue) ----
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken or behaves incorrectly"
- name: "type:enhancement"
  color: "a2eeef"
  description: "Feature request or improvement"
- name: "type:documentation"
  color: "0075ca"
  description: "Content correction (especially 4DI references)"
- name: "type:question"
  color: "d876e3"
  description: "Question — usually should be a Discussion instead"

# ---- Status (where it stands) ----
- name: "status:needs-triage"
  color: "ededed"
  description: "Awaiting initial review"
- name: "status:investigating"
  color: "fbca04"
  description: "Looking into it"
- name: "status:planned"
  color: "0e8a16"
  description: "Accepted, planned for a future release"
- name: "status:in-progress"
  color: "c2e0c6"
  description: "Actively being worked on"
- name: "status:wont-fix"
  color: "ffffff"
  description: "Out of scope — see the comment for reasoning"
- name: "status:duplicate"
  color: "cfd3d7"
  description: "Already tracked in another issue"
- name: "status:cant-reproduce"
  color: "e99695"
  description: "Could not reproduce with the information given"

# ---- Special ----
- name: "good first read"
  color: "7057ff"
  description: "Worth reading even if you're not a developer — sets context"
- name: "pinned"
  color: "fbca04"
  description: "Pinned to the top of the issue list"
